services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: Voice Enabled Smart Browser
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: voice_browser
      DB_USER: root
      DB_PASSWORD: example
      SEARCH_ENGINE_URL: https://www.google.com/search?q=
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: voice_browser
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pexample"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
